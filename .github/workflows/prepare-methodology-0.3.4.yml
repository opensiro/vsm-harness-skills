name: prepare-methodology-0.3.4

on:
  push:
    branches:
      - methodology-0.3.4-oracle-parser-fix
    paths:
      - .github/workflows/prepare-methodology-0.3.4.yml
      - scripts/prepare_034.py

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply 0.3.4 validator patch
        run: python scripts/prepare_034.py
      - name: Validate Methodology
        run: |
          python scripts/validate_skills.py
          python -m unittest discover -s tests -v
      - name: Verify bundled Profile remains synchronized
        run: |
          git clone https://github.com/opensiro/vsm-harness-profile.git .tmp-profile
          python scripts/sync_profile.py --profile-dir .tmp-profile --check
          rm -rf .tmp-profile
      - name: Commit ordinary patch files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add VERSIONING.md SYNTHESIS.md scripts/check_assessment_contract.py tests/test_methodology_contract.py skills/assess-vsm-harness
          git commit -m 'Methodology 0.3.4: fix S3-star completion parser'
          git push
