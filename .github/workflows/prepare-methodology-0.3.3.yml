name: prepare-methodology-0.3.3

on:
  push:
    branches:
      - methodology-0.3.3-reproducibility-patch
    paths:
      - scripts/prepare_033.py
      - .github/workflows/prepare-methodology-0.3.3.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: opensiro/vsm-harness-profile
          ref: f7b5e2fd05f31b8b89775a0f77acea31186fe4de
          path: .tmp-profile
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply patch
        run: python scripts/prepare_033.py
      - name: Sync bundled Profile
        run: python scripts/sync_profile.py --profile-dir .tmp-profile
      - name: Validate Methodology
        run: |
          python scripts/validate_skills.py
          python -m unittest discover -s tests -v
      - name: Commit non-workflow patch
        run: |
          rm -rf .tmp-profile
          git checkout -- .github/workflows/validate.yml .github/workflows/prepare-methodology-0.3.3.yml
          rm -f .github/workflows/publish-methodology.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Methodology 0.3.3: harden assessment reproducibility'
          git push
