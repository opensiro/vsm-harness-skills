"""Publish or verify one immutable VSM Harness Methodology release."""

from __future__ import annotations

import argparse
import json
import os
import re
import subprocess
import tempfile
from pathlib import Path

ROOT = Path(__file__).resolve().parents[1]
VERSION_FILE = "skills/assess-vsm-harness/VERSION"
CHANGELOG = ROOT / "skills" / "assess-vsm-harness" / "CHANGELOG.md"
SEMVER = re.compile(r"^\d+\.\d+\.\d+$")
SHA = re.compile(r"^[0-9a-f]{40}$")


def run(*args: str, check: bool = True) -> subprocess.CompletedProcess[str]:
    return subprocess.run(args, cwd=ROOT, text=True, capture_output=True, check=check)


def changelog_notes(version: str) -> str:
    text = CHANGELOG.read_text(encoding="utf-8")
    match = re.search(rf"^## {re.escape(version)} — .*?$\n(?P<body>.*?)(?=^## |\Z)", text, re.MULTILINE | re.DOTALL)
    if not match:
        raise SystemExit(f"CHANGELOG missing release section for {version}")
    body = match.group("body").strip()
    if not body:
        raise SystemExit(f"CHANGELOG release section for {version} is empty")
    return body


def tag_object(repo: str, tag: str) -> tuple[str, str] | None:
    result = run("gh", "api", f"repos/{repo}/git/ref/tags/{tag}", check=False)
    if result.returncode != 0:
        return None
    data = json.loads(result.stdout)
    return data["object"]["type"], data["object"]["sha"]


def resolved_tag_sha(repo: str, tag: str) -> str | None:
    obj = tag_object(repo, tag)
    if obj is None:
        return None
    kind, sha = obj
    if kind == "commit":
        return sha
    if kind == "tag":
        data = json.loads(run("gh", "api", f"repos/{repo}/git/tags/{sha}").stdout)
        return data["object"]["sha"]
    raise SystemExit(f"unsupported tag object type for {tag}: {kind}")


def main() -> int:
    parser = argparse.ArgumentParser()
    parser.add_argument("--version")
    parser.add_argument("--target-sha")
    args = parser.parse_args()

    version = args.version or (ROOT / VERSION_FILE).read_text(encoding="utf-8").strip()
    target = args.target_sha or run("git", "rev-parse", "HEAD").stdout.strip()
    if not SEMVER.fullmatch(version):
        raise SystemExit(f"invalid Methodology version: {version!r}")
    if not SHA.fullmatch(target):
        raise SystemExit(f"invalid release target SHA: {target!r}")

    repo = os.environ.get("GITHUB_REPOSITORY")
    if not repo:
        raise SystemExit("GITHUB_REPOSITORY is required")
    if not os.environ.get("GH_TOKEN"):
        raise SystemExit("GH_TOKEN is required")

    target_version = run("git", "show", f"{target}:{VERSION_FILE}").stdout.strip()
    if target_version != version:
        raise SystemExit(f"target {target} contains Methodology {target_version}, expected {version}")
    if run("git", "merge-base", "--is-ancestor", target, "HEAD", check=False).returncode != 0:
        raise SystemExit(f"release target {target} is not an ancestor of checked-out HEAD")

    notes = changelog_notes(version)
    tag = f"v{version}"
    existing = resolved_tag_sha(repo, tag)
    if existing is None:
        run("gh", "api", "--method", "POST", f"repos/{repo}/git/refs", "-f", f"ref=refs/tags/{tag}", "-f", f"sha={target}")
    elif existing != target:
        raise SystemExit(f"immutable tag {tag} points to {existing}, expected {target}")

    release = run("gh", "release", "view", tag, "--repo", repo, check=False)
    if release.returncode == 0:
        print(f"Release {tag} already exists and tag target is correct")
        return 0

    body = notes + f"\n\nRelease target: `{target}`.\n"
    with tempfile.NamedTemporaryFile("w", encoding="utf-8", delete=False) as handle:
        handle.write(body)
        notes_path = handle.name
    run("gh", "release", "create", tag, "--repo", repo, "--title", f"VSM Harness Methodology {tag}", "--notes-file", notes_path)
    print(f"Published {tag} at {target}")
    return 0


if __name__ == "__main__":
    raise SystemExit(main())
''')

          write('scripts/check_release_tracking.py', r'''#!/usr/bin/env python3
"""Verify that every tracked Methodology changelog version has a tag and GitHub Release."""

from __future__ import annotations

import json
import os
import re
import subprocess
import sys
from pathlib import Path

ROOT = Path(__file__).resolve().parents[1]
CHANGELOG = ROOT / "skills" / "assess-vsm-harness" / "CHANGELOG.md"
VERSION_FILE = "skills/assess-vsm-harness/VERSION"
TRACK_FROM = (0, 2, 1)


def run(*args: str, check: bool = True) -> subprocess.CompletedProcess[str]:
    return subprocess.run(args, cwd=ROOT, text=True, capture_output=True, check=check)


def versions() -> list[str]:
    text = CHANGELOG.read_text(encoding="utf-8")
    found = re.findall(r"^## (\d+\.\d+\.\d+) —", text, re.MULTILINE)
    return [v for v in found if tuple(map(int, v.split('.'))) >= TRACK_FROM]


def tag_sha(repo: str, tag: str) -> str | None:
    result = run("gh", "api", f"repos/{repo}/git/ref/tags/{tag}", check=False)
    if result.returncode != 0:
        return None
    data = json.loads(result.stdout)
    kind, sha = data["object"]["type"], data["object"]["sha"]
    if kind == "commit":
        return sha
    if kind == "tag":
        data = json.loads(run("gh", "api", f"repos/{repo}/git/tags/{sha}").stdout)
        return data["object"]["sha"]
    return None


def main() -> int:
    repo = os.environ.get("GITHUB_REPOSITORY")
    if not repo or not os.environ.get("GH_TOKEN"):
        print("GITHUB_REPOSITORY and GH_TOKEN are required", file=sys.stderr)
        return 2
    failures: list[str] = []
    for version in versions():
        tag = f"v{version}"
        sha = tag_sha(repo, tag)
        if sha is None:
            failures.append(f"{tag}: missing Git tag")
            continue
        target_version = run("git", "show", f"{sha}:{VERSION_FILE}", check=False)
        if target_version.returncode != 0 or target_version.stdout.strip() != version:
            failures.append(f"{tag}: target {sha} does not contain VERSION {version}")
        if run("gh", "release", "view", tag, "--repo", repo, check=False).returncode != 0:
            failures.append(f"{tag}: missing GitHub Release")
    if failures:
        print("\n".join(failures), file=sys.stderr)
        return 1
    print(f"Release tracking complete for {len(versions())} Methodology versions")
    return 0


if __name__ == "__main__":
    raise SystemExit(main())
''')

