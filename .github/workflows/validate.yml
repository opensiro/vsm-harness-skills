name: validate

on:
  pull_request:
  push:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

jobs:
  skills-and-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: vsm-skills

      - name: Resolve bundled Profile release
        id: bundled-profile
        shell: bash
        working-directory: vsm-skills
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.validate_skills import BUNDLED_PROFILE_VERSION

          skill = Path("skills/assess-vsm-harness/SKILL.md").read_text(encoding="utf-8")
          match = BUNDLED_PROFILE_VERSION.search(skill)
          if not match:
              raise SystemExit("missing bundled Profile version declaration")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"profile_ref=v{match.group(1)}", file=output)
          PY

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/vsm-harness-profile
          ref: ${{ steps.bundled-profile.outputs.profile_ref }}
          path: vsm-harness-profile
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python scripts/validate_skills.py
        working-directory: vsm-skills

      - run: python scripts/render_metrics.py --check
        working-directory: vsm-skills

      - run: python -m unittest discover -s tests -v
        working-directory: vsm-skills

      - run: python scripts/sync_profile.py --profile-dir ../vsm-harness-profile --check
        working-directory: vsm-skills

      - name: Fetch Methodology release history
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        working-directory: vsm-skills
        run: git fetch --tags --force --prune --unshallow origin

      - name: Verify published Methodology release tracking
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_release_tracking.py
        working-directory: vsm-skills
